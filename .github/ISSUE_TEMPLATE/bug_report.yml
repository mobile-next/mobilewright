name: Bug Report
description: Report a bug or unexpected behavior in Mobilewright
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a bug report, please [search existing issues](https://github.com/mobile-next/mobilewright/issues) to avoid duplicates.
        Follow the [reporting guide](https://github.com/mobile-next/mobilewright/blob/main/CONTRIBUTING.md#bug-reports), including isolated latest-release reproduction when feasible.
        Report security vulnerabilities [privately](https://github.com/mobile-next/mobilewright/security/advisories/new). Remove credentials and private app data from attachments.

  - type: input
    id: version
    attributes:
      label: Mobilewright version
      description: Include mobilecli and Node.js versions when relevant. Say if you could not retest the latest release.
      placeholder: "e.g. 1.2.3"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. macOS 15.4, Ubuntu 24.04, Windows 11"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Target platform
      options:
        - iOS
        - Android
        - Both
        - Not applicable (device-independent)
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device or simulator
      description: Include the target OS version, or enter "not applicable" for device-independent problems.
      placeholder: "e.g. iPhone 16 Pro (simulator), Pixel 8 (real device)"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Smallest possible code or CLI/configuration steps. Identify the app or sample when relevant; say if it is private.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Include relevant sanitized DEBUG=mw:* output, raw mobilecli UI dumps for locator/inspector problems (or backend equivalents), and what you tried. Explain unavailable diagnostics.
