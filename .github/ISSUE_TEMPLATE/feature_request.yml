name: Feature Request
description: Propose a new feature or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Features and intentional public behavior changes require an issue and maintainer approval before implementation. A direct maintainer request supplies approval for its stated scope; record it here. See the [approval rules](https://github.com/mobile-next/mobilewright/blob/main/CONTRIBUTING.md#scope-and-approval).

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this feature solve? What use case does it unlock?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Show the test or API you wish worked, any behavior changes, and the equivalent Playwright API if one exists. Prefer a platform-neutral design.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Target platform
      options:
        - iOS
        - Android
        - Both
        - Platform-agnostic
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought of, and why you prefer this one.

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, screenshots, references, related issues, or anything else that would help.
