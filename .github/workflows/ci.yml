name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'ROADMAP.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'ROADMAP.md'
      - 'docs/**'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ['22.12', '24.x']
        include:
          # Windows is ~30% of docs traffic; one Node version is enough to catch win32-only breakage
          - os: windows-latest
            node-version: '22.12'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      # keep LF endings so the generated/ staleness check and eslint behave the same as on Linux
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: |
          # make sure we have playwright's injected engine
          npm run sync:playwright
          git diff --exit-code -- packages/mobilewright-core/src/generated/ || {
            echo "::error::packages/mobilewright-core/src/generated/ is stale — run 'npm run sync:playwright' and commit the result."
            exit 1
          }
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - name: Smoke test CLI binary resolution
        run: |
          node packages/mobilewright/dist/cli.js devices
          node packages/mobilewright/dist/cli.js doctor --json | tee doctor.json || true
          node -e '
            const { checks } = JSON.parse(require("fs").readFileSync("doctor.json", "utf8"));
            const mobilecli = checks.find(c => c.id === "mobilecli");
            console.log(mobilecli);
            if (mobilecli?.status !== "ok") process.exit(1);
          '

  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t mobilewright:ci .
      - name: Smoke test
        run: docker run --rm mobilewright:ci help
